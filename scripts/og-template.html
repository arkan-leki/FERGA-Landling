<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FERGA OG image template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: "Inter Tight", system-ui, sans-serif;
        color: #1d2630;
        background: linear-gradient(135deg, #fff6ec 0%, #ffffff 48%, #fff2e2 100%);
        position: relative;
      }
      .blob { position: absolute; border-radius: 9999px; filter: blur(70px); }
      .b1 { top: -180px; left: -140px; width: 620px; height: 620px; background: rgba(255, 140, 25, 0.3); }
      .b2 { bottom: -220px; right: -160px; width: 620px; height: 620px; background: rgba(255, 178, 44, 0.26); }
      .b3 { top: 40px; right: 120px; width: 380px; height: 380px; background: rgba(111, 168, 220, 0.14); }

      .wrap {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 56px 72px;
      }

      .icon-wrap { position: relative; }
      .halo {
        position: absolute;
        inset: -16%;
        border-radius: 9999px;
        filter: blur(34px);
        opacity: 0.6;
        background: conic-gradient(from 140deg, #ffb22c, #ff8c19, #ff6b35, #ffd454, #6fa8dc, #ffb22c);
      }
      .icon {
        position: relative;
        width: 210px;
        height: 210px;
        padding: 22px;
        border-radius: 22%;
        background: #fff;
        box-shadow: 0 26px 60px -24px rgba(29, 38, 48, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon img { width: 100%; height: 100%; object-fit: contain; }

      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(29, 38, 48, 0.45);
      }
      h1 {
        font-size: 68px;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.05;
        text-align: center;
      }
      .sub {
        font-size: 30px;
        font-weight: 700;
        color: #ff8c19;
        text-align: center;
      }
      .stores {
        margin-top: 6px;
        display: flex;
        gap: 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        letter-spacing: 0.06em;
        color: rgba(29, 38, 48, 0.6);
      }
      .stores span {
        padding: 9px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 26px -16px rgba(29, 38, 48, 0.4);
      }
      .brand {
        position: absolute;
        bottom: 34px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(29, 38, 48, 0.36);
      }
    </style>
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <div class="wrap">
      <div class="icon-wrap">
        <div class="halo"></div>
        <div class="icon"><img src="../public/ferga-logo.jpg" alt="" /></div>
      </div>

      <div class="eyebrow">Kurdistan's education marketplace</div>
      <h1>Ferga — Teaching &amp; Learning</h1>
      <div class="sub">Find tutors and courses near you</div>
      <div class="stores">
        <span>App Store</span>
        <span>Google Play</span>
      </div>
    </div>

    <div class="brand">ferkar.co</div>
  </body>
</html>
